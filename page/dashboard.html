<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <title>FixIT | LCUP</title>
    <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body>
   <header class="header-container">
     <div class="logo-container">
        <div class="logo-img-container">
            <img src="/assets/images/LCUP (2).png" alt="LCUP Logo" class="lcup-logo">
        </div>
        <div class="logo-text-container">
            <h2 class="lcup-text">La Consolacion University Philippines</h2>
            <span class="header-supporting-text">Campus Support</span>
        </div>
     </div>
     <nav class="ul-container">
        <ul class="list-container">
            <li class="list-choices">Home</li>
            <li class="list-choices">Report Issue</li>
            <li class="list-choices">My reports</li>
            <li class="list-choices">Announcements</li>
        </ul>
     </nav>
    <div class="right-header-container">
         <button class="add-report">
           + Submit Report
         </button>
         <i class="ti ti-bell notif">
            <span class="notif-count">3</span>
         </i>
         <i class="ti ti-settings notif"></i>
        <div class="pfp-container">
            <img src="/assets/images/janjan.jpg" alt="user profile image" class="pfp-image">
            <div class="pfp-container-text">
                <p>Lawrence Pagdanganan</p>
                <span>3rd Year Student</span>
            </div>
        </div>
    </div>
   </header> 
</body>
</html>
