<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Material+Symbols+Outlined&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>FixIt - Command & Dispatch</title>
  </head>
  <body>
    <div class="shell">
      <aside class="side" id="side"></aside>

      <div class="main">
        <div class="row wrap">
          <h1>Dispatch Operations</h1>
          <div class="right row">
            <a class="btn" href="index.html">Create Request</a>
            <button class="btn primary" id="export">Export Report</button>
          </div>
        </div>

        <div class="grid4" id="kpis"></div>

        <div class="cols">
          <div class="stack">
            <div class="card">
              <div class="row wrap">
                <div>
                  <h2>Work Order Dispatch Matrix</h2>
                  <div class="small mute">Real-time queueing and technician assignment</div>
                </div>
              </div>
              <div class="tabs" id="tabs" style="margin:16px 0"></div>
              <div class="scroll">
                <table>
                  <thead>
                    <tr>
                      <th>Ticket</th>
                      <th>Incident</th>
                      <th>Location</th>
                      <th>Technician</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="rows"></tbody>
                </table>
              </div>
            </div>

            <div class="card">
              <h2>Facility Performance & Request Volume</h2>
              <div class="row" id="dist" style="height:12px;margin:16px 0;gap:2px"></div>
              <div class="row wrap" id="legend" style="gap:16px"></div>
            </div>
          </div>

          <div class="stack">
            <div class="card">
              <h2>Technician Roster</h2>
              <div id="roster" class="stack" style="gap:12px;margin-top:12px"></div>
            </div>
            <div class="card">
              <h2>Live Activity Ledger</h2>
              <div id="ledger" style="margin-top:12px"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
